ambiguities:
  - field: FI2010_feature_mode
    source_status: AMBIGUOUS
    finding: "paper experiments use 104 handcrafted features, while the repository default also sets all_features=true"
    frozen_interpretation: "controlled DeepBook comparison uses the existing 40 raw LOB rows; no loader or label change"
  - field: sequence_length
    source_status: AMBIGUOUS
    finding: "official configuration uses 128 while the controlled DeepBook windows are fixed at 100"
    frozen_interpretation: "model-side sequence length is 100 for apples-to-apples comparison"
  - field: alternative_labels
    source_status: AMBIGUOUS
    finding: "repository provides horizon-unbiased labeling absent from the accepted DeepBook contract"
    frozen_interpretation: "alternative labels are excluded and recorded only as a future ablation"
adaptations:
  - "input uses existing [batch, 1, 100, 40] DeepBook windows and the source book-only hidden_dim=40 interpretation"
  - "the source order-type embedding is not used because FI-2010 has no LOBSTER order-type column"
  - "sinusoidal encoding is registered as a non-trainable buffer for deterministic device moves"
  - "Bilinear Normalization zero-variance protection uses clamp_min(1e-4), replacing source in-place replacement with a device-safe operation"
  - "DeepBook validation, purge, embargo, checkpoints, deterministic seeds, and metrics use the shared runner"
