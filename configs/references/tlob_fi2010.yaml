findings:
  input: "official FI-2010 preprocessing exposes 144 features when all_features=true and 40 raw LOB features otherwise"
  source_configuration: {hidden_dim: 40, num_layers: 4, num_heads: 1, is_sin_emb: true, learning_rate: 0.0001, sequence_length: 128, all_features: true, batch_size: 32, max_epochs: 10, optimizer: Adam}
  normalization: "Bilinear Normalization before projection"
  block_order: "temporal self-attention (with internal FFN), spatial self-attention (with internal FFN) — TransformerLayer internalises the MLP; there is no separate MLPLOB block appended per layer"
  temporal_attention: "self-attention over the snapshot axis"
  spatial_attention: "self-attention over the feature axis"
  dimensions: "final temporal and spatial blocks reduce hidden and sequence dimensions by four"
  classifier: "flatten followed by repeated quarter-width Linear/GELU layers while width exceeds 128, then three logits"
  labels: "paper retains original FI-2010 labels; repository also implements an alternative horizon-unbiased method"
  source_horizons: [10, 20, 50, 100]
