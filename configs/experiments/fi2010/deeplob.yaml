schema_version: 1
experiment_name: fi2010_deeplob
source_config: configs/data/fi2010.yaml
protocol_document: reports/protocol/fi2010_baseline_reproduction.md
reference_paper: arxiv:1808.03668v6
reference_repository_commit: ff14d7c2fd38bdfc143389786993d0f0236d4eb8
benchmark_variant: no_auction
normalization: zscore
input_rows: 40
input_shape: [1, 100, 40]
sequence_length: 100
horizons: [10, 20, 30, 50, 100]
class_order: [up, stationary, down]
seeds: [1337, 2027, 31415, 424242, 8675309]
model:
  convolution_channels: 32
  inception_branch_channels: 64
  leaky_relu_slope: 0.01
  activations: [leaky_relu, tanh, leaky_relu]
  inception_kernels: [[1, 1, 3, 1], [1, 1, 5, 1], [3, 1, 1, 1]]
  lstm_input_size: 192
  lstm_hidden_size: 64
  lstm_layers: 1
  dropout: 0.0
  output_logits: 3
training:
  loss: cross_entropy
  optimizer: adam
  learning_rate: 0.0001
  batch_size: 64
  max_epochs: 50
  early_stopping_metric: validation_macro_f1
  patience: 10
  class_weights: null
  mixed_precision: false
  gradient_clipping: null
  scheduler: null
validation:
  policy: chronological_training_only
  purge_events: 200
  embargo_events: 200
runs:
  smoke_model: deeplob
  smoke_setup: anchored_forward
  smoke_fold: 7
  smoke_horizon: 10
  smoke_seed: 1337
outputs:
  ignored_root: artifacts/fi2010/baselines
  report_json: reports/results/fi2010_baseline_reproduction.json
  report_markdown: reports/results/fi2010_baseline_reproduction.md
