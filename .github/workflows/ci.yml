name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: fast tier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Fast tests
        run: pytest -m "fast and not slow and not gpu and not data" --maxfail=1

      - name: Secret scan
        run: detect-secrets scan --baseline .secrets.baseline .

      - name: Verify .env not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env is tracked by git"
            exit 1
          fi
          echo ".env is not tracked"

  slow:
    name: statistical tier
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"
      - name: Slow / statistical tests
        run: pytest -m "slow and not gpu and not data" --durations=20

  contracts:
    name: protocol + contracts
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"
      - name: Validate schemas and registries
        run: pytest tests/unit/test_data_contracts.py tests/unit/test_research_registries.py tests/property -q

      - name: Environment doctor smoke test
        run: pytest tests/smoke -q

      - name: No paid-data authorization enabled
        run: |
          python -c "
          import yaml
          policy = yaml.safe_load(open('configs/spending_policy.yaml'))
          assert policy['paid_data']['default_authorization'] is False
          assert policy['core']['research_budget_usd'] == 0
          print('Spending policy safe')
          "
