name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: foundation gates (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create project environment
        run: python -m venv .venv

      - name: Install
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -e ".[dev,data]"

      - name: Ruff lint
        run: ./.venv/bin/python -m ruff check .

      - name: Ruff format check
        run: ./.venv/bin/python -m ruff format --check .

      - name: Mypy type check
        run: ./.venv/bin/python -m mypy src

      - name: Foundation tests
        run: ./.venv/bin/python -m pytest tests/unit tests/property tests/smoke -q --tb=short

      - name: Repository policy check
        run: ./.venv/bin/python scripts/check_repository_policy.py

      - name: Pre-commit (all files)
        run: ./.venv/bin/python -m pre_commit run --all-files

      - name: Package build
        run: ./.venv/bin/python -m build

      - name: Environment doctor
        run: ./.venv/bin/python -m deepbook.cli.doctor
